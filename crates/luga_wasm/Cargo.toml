[package]
name = "luga_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
luga_check = { path = "../luga_check" }
luga_syntax = { path = "../luga_syntax" }

console_error_panic_hook = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.129"
