[package]
name = "luga"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["runtime"]

[dependencies]
chumsky = "0.10"
ariadne = "0.5"
logos = "0.15"
thiserror = "2.0"

cranelift = { version = "0.123", features = [
    "core",
    "frontend",
    "module",
    "object",
] }

clap = { version = "4.5", features = ["derive"] }

indexmap = "2.10"
