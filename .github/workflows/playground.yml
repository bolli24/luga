# Builds the playground image, checks it against the playground contract, and promotes it to
# :playground when the check passes. The VPS pulls :playground. See playground/Dockerfile.
# A failed run leaves :playground on the previous image; GitHub emails about the failure.

name: Playground image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Promote in push order; a newer run waits for the older one instead of racing it.
concurrency:
  group: playground-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bolli24/luga

jobs:
  build:
    runs-on: ubuntu-24.04
    # Every step has its own limit, so a hang fails within minutes instead of after GitHub's
    # default of 6 hours. This covers what they don't, like saving the build cache at the end.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2

      - id: tag
        timeout-minutes: 1
        run: echo "image=$IMAGE:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        timeout-minutes: 5
      - uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A cold build compiles the compiler and the linter from scratch
      - uses: docker/build-push-action@v6
        timeout-minutes: 40
        with:
          context: .
          file: playground/Dockerfile
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.tag.outputs.image }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  contract:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: bolli24/playground-runner/.github/workflows/contract.yml@main
    with:
      image: ${{ needs.build.outputs.image }}

  promote:
    needs: [build, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
        timeout-minutes: 5
      - uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as :playground, keeping the previous one as :playground-prev
        timeout-minutes: 5
        run: |
          if docker buildx imagetools inspect "$IMAGE:playground" > /dev/null 2>&1; then
            docker buildx imagetools create --tag "$IMAGE:playground-prev" "$IMAGE:playground"
          fi
          docker buildx imagetools create --tag "$IMAGE:playground" "${{ needs.build.outputs.image }}"
