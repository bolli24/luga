# Examples shown in the playground, see CONTRACT.md in the playground-runner repo.
# The Dockerfile copies test/ next to this file, so paths are relative to test/.

[[program]]
id = "tour"
title = "Tour"
files = ["tour.luga", "modules/vec.luga", "modules/dir.luga"]
entry = "tour.luga"
expect.phase = "run"
expect.stdout = "language tour\nanswer\nleft\ntour complete\n"

[[program]]
id = "hello_world"
title = "Hello world"
files = ["hello_world.luga"]
entry = "hello_world.luga"
expect.phase = "run"
expect.stdout = "Hello, world!\nHello, Luga! (0)\nHello, Luga! (1)\nHello, Luga! (2)\n"

[[program]]
id = "function"
title = "Functions"
files = ["function.luga"]
